{% extends 'base.html' %}

{% block auth %}

<form class="login" method="post" action="{% url 'users:login' %}">
    {% csrf_token %}

    <table>
<tr>
    <td>{{ form.username.label_tag }}</td>
    <td>{{ form.username }}</td>
</tr>
<tr>
    <td>{{ form.password.label_tag }}</td>
    <td>{{ form.password }}</td>
</tr>
    </table>

    <input type="submit" value="login">

    <p><a href="{% url 'users:password_reset' %}">Forget password?</a></p>
</form>
{% endblock auth %}
