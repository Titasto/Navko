{% extends 'base.html' %}

{% block password_change %}
<form method="post" class="password_change">
    {% csrf_token %}
    {{ form.non_fields_error }}
    {% for field in form %}
        <label>{{ field.label }}</label>{{ field }}
        {{ field.errors }}
    {% endfor %}

    <button type="submit">Save</button>
</form>

{% endblock password_change %}
