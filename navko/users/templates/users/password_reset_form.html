{% extends 'base.html' %}

{% block password_reset %}

<form class='password_reset' method="post">
    {% csrf_token %}
    {{ form.non_fields_error }}
    {% for field in form %}
        <label>{{field.label}}</label>{{ field }}
        {{ field.error }}
    {% endfor %}

    <button type="submit">Send message</button>
</form>
{% endblock password_reset %}
